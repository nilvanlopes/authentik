version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    volumes:
      - authentik-database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    networks:
      - authentik-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

  server:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    command: server
    user: "1000:1000"
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "127.0.0.0/8,::1/128,10.0.1.0/24,10.0.7.0/24"
      AUTHENTIK_COOKIE__SECURE: "true"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST}
      AUTHENTIK_EMAIL__PORT: 587
      AUTHENTIK_EMAIL__USERNAME: ${AUTH_EMAIL_USER}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: ${AUTH_EMAIL_FROM}

    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    networks:
      - traefik-public
      - authentik-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        
        # HTTPS Router
        - "traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_HOST}`)"
        - "traefik.http.routers.authentik.entrypoints=websecure"
        - "traefik.http.routers.authentik.tls.certresolver=cloudflare"
        - "traefik.http.routers.authentik.middlewares=crowdsec@file,authentik-headers"
        - "traefik.http.routers.authentik.service=authentik"

        # Os outposts usam estes endpoints autenticados por token para
        # sincronizar configuração e manter o websocket de eventos. A rota
        # dedicada evita que o CrowdSec bloqueie a comunicação servidor->outpost.
        - "traefik.http.routers.authentik-outpost-api.rule=Host(`${AUTHENTIK_HOST}`) && (PathPrefix(`/api/v3/outposts/`) || Path(`/api/v3/root/config/`) || PathPrefix(`/ws/outpost/`))"
        - "traefik.http.routers.authentik-outpost-api.entrypoints=websecure"
        - "traefik.http.routers.authentik-outpost-api.priority=100"
        - "traefik.http.routers.authentik-outpost-api.tls.certresolver=cloudflare"
        - "traefik.http.routers.authentik-outpost-api.middlewares=authentik-outpost-host"
        - "traefik.http.routers.authentik-outpost-api.service=authentik"
        - "traefik.http.middlewares.authentik-outpost-host.headers.customrequestheaders.Host=0.0.0.0"
        
        # Service
        - "traefik.http.services.authentik.loadbalancer.server.port=9000"
        
        # Security headers
        - "traefik.http.middlewares.authentik-headers.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.authentik-headers.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.authentik-headers.headers.stsPreload=true"
        - "traefik.http.middlewares.authentik-headers.headers.forceSTSHeader=true"
        - "traefik.http.middlewares.authentik-headers.headers.frameDeny=true"
        - "traefik.http.middlewares.authentik-headers.headers.contentTypeNosniff=true"
        - "traefik.http.middlewares.authentik-headers.headers.browserXssFilter=true"
        - "traefik.http.middlewares.authentik-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  worker:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    command: worker
    user: root
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST}
      AUTHENTIK_EMAIL__PORT: 587
      AUTHENTIK_EMAIL__USERNAME: ${AUTH_EMAIL_USER}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: ${AUTH_EMAIL_FROM}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-media:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    networks:
      - authentik-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

volumes:
  authentik-database:
    driver: local
  authentik-media:
    driver: local
  authentik-certs:
    driver: local
  authentik-templates:
    driver: local

networks:
  traefik-public:
    external: true
  authentik-internal:
    driver: overlay
