version: "3.8"

services:
  proxy:
    image: ghcr.io/goauthentik/proxy:2026.8.4@sha256:70bd1eb19dfb0d15efa12f2d3377a7dd2655a2aca06ffb8e221199ae323a6e57
    environment:
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:?authentik host required}
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN:?authentik token required}
      AUTHENTIK_INSECURE: ${AUTHENTIK_INSECURE:-false}
      AUTHENTIK_HOST_BROWSER: ${AUTHENTIK_HOST_BROWSER:-}
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "127.0.0.0/8,::1/128,10.0.1.0/24"
      TMPDIR: /var/lib/authentik-outpost-session
    volumes:
      - authentik-n8n-outpost-session:/var/lib/authentik-outpost-session
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  traefik-public:
    external: true

volumes:
  authentik-n8n-outpost-session:
