version: "3.8"

services:
  proxy:
    image: ghcr.io/goauthentik/proxy:2026.8.5@sha256:34640cf41e009ab052d4b9119cea816713adcd1eaac95de6caefebfe86d3fcd9
    environment:
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:?authentik host required}
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN:?authentik token required}
      AUTHENTIK_INSECURE: ${AUTHENTIK_INSECURE:-false}
      AUTHENTIK_HOST_BROWSER: ${AUTHENTIK_HOST_BROWSER:-}
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  traefik-public:
    external: true
