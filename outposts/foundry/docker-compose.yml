version: "3.8"

services:
  proxy:
    image: ghcr.io/goauthentik/proxy:2026.8.5@sha256:34640cf41e009ab052d4b9119cea816713adcd1eaac95de6caefebfe86d3fcd9
    user: "0:0"
    environment:
      AUTHENTIK_HOST: http://server:9000
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN:?authentik token required}
      AUTHENTIK_INSECURE: ${AUTHENTIK_INSECURE:-false}
      AUTHENTIK_HOST_BROWSER: ${AUTHENTIK_HOST_BROWSER:-}
      TMPDIR: /var/lib/authentik-outpost-session
    volumes:
      - authentik-foundry-outpost-session:/var/lib/authentik-outpost-session
    networks:
      - traefik-public
      - authentik-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  traefik-public:
    external: true
  authentik-internal:
    external: true
    name: authentik_authentik-internal

volumes:
  authentik-foundry-outpost-session:
